name: Import legacy Phantom archives and videos
on:
  push:
    branches:
      - integration/legacy-assets-equivalence-20261115
    paths:
      - tools/localize_legacy_support_media.py
      - .github/workflows/import-legacy-support-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  legacy-media:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install archive and video integrity tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full ffmpeg
      - name: Fetch and verify the four original RAR and ZIP archives
        run: python tools/localize_legacy_support_media.py --archives
      - name: Commit archive files and same-origin links immediately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/support/legacy-media-manifest.json assets/support/support-phantom-2/ support-phantom-2.html
          git commit -m "Import four original Phantom 2 archive files and local links"
          git fetch origin integration/legacy-assets-equivalence-20261115
          git rebase origin/integration/legacy-assets-equivalence-20261115
          git push origin HEAD:integration/legacy-assets-equivalence-20261115
      - name: Download, probe, and upload two original MP4s into GitHub Release
        run: python tools/localize_legacy_support_media.py --videos
      - name: Verify all archives and GitHub release assets
        run: python tools/localize_legacy_support_media.py --verify
      - name: Commit video links and checksummed media manifest
        run: |
          git add assets/support/legacy-media-manifest.json support-phantom-2.html support-phantom-4.html
          git commit -m "Publish original Phantom 2 and 4 video manuals as release assets"
          git fetch origin integration/legacy-assets-equivalence-20261115
          git rebase origin/integration/legacy-assets-equivalence-20261115
          git push origin HEAD:integration/legacy-assets-equivalence-20261115
