name: Selective recording 23 targeted Chromium QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'selective-recording.html'
      - '.github/workflows/selective-recording-23-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run page 23 at 375/768/1024/1440 in light/dark themes
        run: |
          python - <<'PY'
          import os, json, threading
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          
          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          os.chdir(ROOT)
          OUT = ROOT / "qa-artifacts" / "selective-recording-23"
          OUT.mkdir(parents=True, exist_ok=True)
          
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          server = ThreadingHTTPServer(("127.0.0.1", 0), Quiet)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          url = f"http://127.0.0.1:{server.server_address[1]}/selective-recording.html"
          results = []
          try:
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(headless=True, args=["--no-sandbox"])
                  for width, height in ((375,812), (768,900), (1024,768), (1440,900)):
                      for theme in ("light", "dark"):
                          context = browser.new_context(viewport={"width":width,"height":height}, reduced_motion="reduce")
                          context.add_init_script(f"localStorage.setItem('mdis-theme','{theme}')")
                          page = context.new_page()
                          failures = []
                          page.on("pageerror", lambda error: failures.append(str(error)))
                          page.on("response", lambda resp: failures.append(f"HTTP {resp.status}: {resp.url}") if resp.status >= 400 and resp.url.startswith(url.rsplit("/",1)[0]) else None)
                          resp = page.goto(url, wait_until="networkidle", timeout=30000)
                          assert resp.status == 200, resp.status
                          page.wait_for_selector(".site-theme-toggle", timeout=10000)
                          assert page.locator("html").get_attribute("data-theme") == theme
                          assert page.locator("h1").count() == 1
                          assert page.locator("h1").inner_text() == "Селективная запись переговоров"
                          assert page.locator(".site-header").count() == 1
                          assert page.locator(".footer-next").count() == 1
                          assert page.locator(".solutions-switcher").count() == 1
                          assert page.locator(".solutions-switcher-label").get_attribute("href") == "phantom-catalog.html"
                          assert page.locator(".solutions-switcher-neighbor--previous").get_attribute("href") == "ip-telephony.html"
                          assert page.locator(".solutions-switcher-neighbor--next").get_attribute("href") == "index.html"
                          assert page.locator('.table-scroll[tabindex="0"]').count() == 2
                          assert page.locator('meta[name="robots"]').get_attribute("content") == "noindex, nofollow"
                          assert page.locator('main a[href^="mailto:sales@mdis.ru"]').count() == 1, "Main CTA mailto count mismatch"
                          assert page.locator(".skip-nav").get_attribute("href") == "#page-content"
                          assert page.evaluate("getComputedStyle(document.documentElement).scrollBehavior") == "auto"
                          page.keyboard.press("Tab")
                          assert page.evaluate("document.activeElement?.classList.contains('skip-nav')"), "Skip link not first keyboard control"
                          assert page.locator(".skip-nav").bounding_box()["y"] >= 0, "Skip link not visible when focused"
                          page.locator(".skip-nav").press("Enter")
                          assert page.evaluate("location.hash") == "#page-content"
                          assert page.evaluate("Math.max(document.documentElement.scrollWidth,document.body.scrollWidth) <= innerWidth+1"), "Horizontal body overflow"
                          for anchor in page.locator('main a[href^="#"]').all():
                              target = anchor.get_attribute("href")[1:]
                              assert page.locator(f'[id="{target}"]').count() == 1, f"Broken anchor {target}"
                          for asset in page.locator("img").all():
                              assert asset.evaluate("(node)=>node.complete && node.naturalWidth>0"), f"Broken image {asset.get_attribute('src')}"
                          if theme == "dark":
                              assert page.locator(".eyebrow").first.evaluate("(el)=>getComputedStyle(el).color") == "rgb(255, 113, 132)"
                          page.locator(".site-theme-toggle").click()
                          other = "dark" if theme == "light" else "light"
                          assert page.locator("html").get_attribute("data-theme") == other
                          page.locator(".site-theme-toggle").click()
                          assert page.locator("html").get_attribute("data-theme") == theme
                          assert not failures, f"Browser errors: {failures}"
                          page.screenshot(path=str(OUT / f"page-{width}-{theme}.png"), full_page=True)
                          results.append({"width":width, "theme":theme, "status":"PASS", "pageerrors":len(failures)})
                          print(f"PASS Chromium {width} {theme}", flush=True)
                          context.close()
                  browser.close()
          finally:
              server.shutdown()
              (OUT / "result.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-recording-23-browser-qa
          path: qa-artifacts/selective-recording-23/
