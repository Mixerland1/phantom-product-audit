name: Scheme 04 source inspection
on:
  push:
    branches: [fix/scheme04-lan-ports-20261116]
    paths: ['.github/workflows/scheme04-inspect.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report and preserve original scheme asset
        run: |
          file assets/schemes/protocols-sip-h323.webp
          sha256sum assets/schemes/protocols-sip-h323.webp
          mkdir -p qa-artifacts/scheme04
          cp assets/schemes/protocols-sip-h323.webp qa-artifacts/scheme04/original.webp
      - uses: actions/upload-artifact@v4
        with:
          name: scheme04-original-image
          path: qa-artifacts/scheme04/original.webp
