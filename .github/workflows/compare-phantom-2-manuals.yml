name: Inspect Phantom 2 Word and PDF equivalence
on:
  push:
    branches:
      - integration/legacy-assets-equivalence-20261115
    paths:
      - tools/compare_phantom_2_manuals.py
      - .github/workflows/compare-phantom-2-manuals.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF and legacy DOC text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils antiword
      - name: Compare the six source files and collect proof
        run: python tools/compare_phantom_2_manuals.py
      - name: Upload detailed comparison report
        uses: actions/upload-artifact@v4
        with:
          name: phantom-2-word-pdf-comparison
          path: docs/phantom-2-word-pdf-comparison.json
      - name: Store comparison report for integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/phantom-2-word-pdf-comparison.json
          git commit -m "Report semantic comparison of three Phantom 2 Word PDF pairs"
          git fetch origin integration/legacy-assets-equivalence-20261115
          git rebase origin/integration/legacy-assets-equivalence-20261115
          git push origin HEAD:integration/legacy-assets-equivalence-20261115
