name: Probe original MDIS Word download
on:
  workflow_dispatch:
  push:
    branches:
      - integration/localize-support-word-docs-20261115
    paths:
      - .github/workflows/probe-support-word.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare official download routes and HTTP options
        shell: bash
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import subprocess, time
          path='/upload/iblock/372/3722c7e6fc126bd9001a2d9c048acb6b.doc'
          base='https://mdis.ru'+path
          trials={
          'https-normal':(['--http1.1'],base),
          'https-http2':(['--http2'],base),
          'www-https':(['--http1.1'],'https://www.mdis.ru'+path),
          'http-normal':(['--http1.1'],'http://mdis.ru'+path),
          'http-www':(['--http1.1'],'http://www.mdis.ru'+path),
          'range-0-1k':(['--http1.1','-H','Range: bytes=0-1023'],base),
          'query-download':(['--http1.1'],base+'?download=1'),
          'referer':(['--http1.1','-e','https://mdis.ru/support/','-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36'],base),
          'identity':(['--http1.1','-H','Accept-Encoding: identity'],base)
          }
          def run(trial):
            name,(opts,url)=trial
            cmd=['curl','--location','--silent','--output','/dev/null','--max-time','16','--connect-timeout','6','--write-out','CODE=%{http_code} BYTES=%{size_download} SPEED=%{speed_download} REDIRECT=%{redirect_url}',*opts,url]
            t=time.monotonic()
            try:
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=20)
              return (name,p.returncode,p.stdout.strip(),round(time.monotonic()-t,1),p.stderr[-120:])
            except Exception as e:
              return (name,'ERROR',str(e),round(time.monotonic()-t,1),'')
          with ThreadPoolExecutor(max_workers=9) as pool:
            for f in as_completed([pool.submit(run,x) for x in trials.items()]):
              print('PROBE',f.result(),flush=True)
          PY
