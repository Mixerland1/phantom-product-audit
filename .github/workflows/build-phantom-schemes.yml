name: Build Phantom scheme images (one-time)
on:
  push:
    paths:
      - '.github/workflows/build-phantom-schemes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download and enhance source-grounded images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from io import BytesIO
          from PIL import Image,ImageFilter,ImageOps
          sources = {
            "ip-principle":"https://mdis.ru/upload/iblock/915/915427e39cbd70c1a371d10f7932f0d9.jpg",
            "tricom-gip":"https://mdis.ru/upload/iblock/5a1/5a15cd438461e2d75dce96cb3b8b65bb.jpg",
            "minicom-dx500":"https://mdis.ru/upload/iblock/3d7/3d7b42155ad929c99107cd6fc51fccd2.JPG",
            "protocols-sip-h323":"https://mdis.ru/upload/iblock/1ef/1efeaa68c3d7e8f73fb15c9c16bf34fa.jpg",
          }
          directory=Path("assets/schemes")
          directory.mkdir(parents=True,exist_ok=True)
          for stem,url in sources.items():
            data=urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=30).read()
            if len(data)<3000 or len(data)>20000000: raise RuntimeError(f"Invalid image size {stem}: {len(data)}")
            with Image.open(BytesIO(data)) as original:
              if original.width < 300 or original.height < 200: raise RuntimeError(f"Unexpectedly small {stem}")
              image=ImageOps.exif_transpose(original).convert("RGB")
            # Preserve the original wiring/text. No generative content or invented topology.
            factor=min(3.0,2400/max(image.size))
            if factor>1:
              image=image.resize((round(image.width*factor),round(image.height*factor)),Image.Resampling.LANCZOS)
            image=image.filter(ImageFilter.UnsharpMask(radius=1.1,percent=145,threshold=2))
            dest=directory/(stem+".webp")
            image.save(dest,format="WEBP",quality=91,method=6)
            print(f"OK {stem}: {original.size} -> {image.size}, {dest.stat().st_size} bytes")
          PY
      - name: Commit enhanced diagrams
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/schemes/*.webp
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "assets: add locally optimized official Phantom diagrams"
          git push origin HEAD:main
