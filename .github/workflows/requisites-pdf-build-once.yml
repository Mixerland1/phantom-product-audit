name: Requisites scans — build PDF copies (one-time)
on:
  push:
    branches: [integrator/requisites-pdf-and-seo-measurement-20261115]
    paths:
      - '.github/workflows/requisites-pdf-build-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate PDF copies without modifying original JPG streams
        run: |
          python tools/build_requisites_pdfs.py
          python tools/build_requisites_pdfs.py --check
      - name: Commit generated PDFs only to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/requisites/mdis-ooo-mdis.pdf assets/requisites/mdis-information-systems.pdf
          git commit -m "Add faithful PDF copies of original requisites JPGs"
          git fetch origin integrator/requisites-pdf-and-seo-measurement-20261115
          git rebase origin/integrator/requisites-pdf-and-seo-measurement-20261115
          git push origin HEAD:integrator/requisites-pdf-and-seo-measurement-20261115
