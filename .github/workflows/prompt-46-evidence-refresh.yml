name: Prompt 46 final evidence refresh
on:
  push:
    branches:
      - integrator/prompt-46-final-migration-20261115
    paths:
      - .github/workflows/prompt-46-evidence-refresh.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and generate final document and link inventory
        run: python tools/final_migration_audit.py
      - name: Commit final machine-readable evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHANTOM_FINAL_MIGRATION_46.json
          git commit -m "Refresh final local migration inventory after source migrations" || exit 0
          git fetch origin integrator/prompt-46-final-migration-20261115
          git rebase origin/integrator/prompt-46-final-migration-20261115
          git push origin HEAD:integrator/prompt-46-final-migration-20261115
