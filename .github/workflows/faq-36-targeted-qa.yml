name: FAQ 36 targeted Chromium QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'faq.html'
      - '.github/workflows/faq-36-targeted-qa.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run FAQ 36 real browser QA in 8 combinations
        run: |
          python - <<'PY'
          import os, json, threading
          from pathlib import Path
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          
          ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          os.chdir(ROOT)
          OUT = ROOT / "qa-artifacts" / "faq-36"
          OUT.mkdir(parents=True, exist_ok=True)
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          server = ThreadingHTTPServer(("127.0.0.1", 0), Quiet)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          base = f"http://127.0.0.1:{server.server_address[1]}/"
          results=[]
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=["--no-sandbox"])
                  for width,height in ((375,812),(768,900),(1024,768),(1440,900)):
                      for theme in ("light","dark"):
                          context=browser.new_context(viewport={"width":width,"height":height},reduced_motion="reduce")
                          context.add_init_script(f"localStorage.setItem('mdis-theme','{theme}')")
                          page=context.new_page()
                          errors=[]
                          page.on("pageerror",lambda exc: errors.append(str(exc)))
                          page.on("response",lambda resp: errors.append(f"HTTP {resp.status} {resp.url}") if resp.status>=400 and resp.url.startswith(base) else None)
                          response=page.goto(base+"faq.html",wait_until="networkidle",timeout=30000)
                          assert response.status==200, f"FAQ HTTP {response.status}"
                          page.wait_for_selector(".site-theme-toggle",timeout=10000)
                          assert page.locator("html").get_attribute("data-theme")==theme, "Theme initial mismatch"
                          assert page.locator("main h1").count()==1
                          assert page.locator("main h1").inner_text()=="База вопросов"
                          assert page.locator('meta[name="robots"]').get_attribute("content")=="noindex, nofollow"
                          assert page.locator(".site-header").count()==1
                          assert page.locator(".footer-next").count()==1
                          assert page.locator(".solutions-switcher").count()==1
                          assert page.locator('.solutions-switcher-label[href="support.html"]').count()==1
                          assert page.locator('.solutions-switcher-neighbor--previous[href="support-stantsiya-zapisi.html"]').count()==1
                          assert page.locator('.solutions-switcher-neighbor--next[href="support-phantom-2.html"]').count()==1
                          assert page.locator("main details.faq-item").count()==39
                          assert page.locator("main details.faq-item summary").count()==39
                          assert page.locator("main .faq-answer").count()==39
                          assert page.locator(".faq-index-links a").count()==7
                          expected={"general":6,"versions":5,"telephony":6,"archive":7,"security":6,"updates":4,"commercial":5}
                          for key,count in expected.items():
                              assert page.locator(f"section#{key} details.faq-item").count()==count, f"Count mismatch {key}"
                              assert page.locator(f'.faq-index-links a[href="#{key}"] span').inner_text()==str(count),f"Index count mismatch {key}"
                          for link in page.locator('main a[href^="#"]').all():
                              anchor=link.get_attribute("href")[1:]
                              assert page.locator(f'[id="{anchor}"]').count()==1, f"Bad anchor {anchor}"
                          assert page.locator('.request-action a[href^="mailto:support@mdis.ru"]').count()==1
                          assert page.evaluate("getComputedStyle(document.documentElement).scrollBehavior")=="auto", "No reduced motion"
                          page.keyboard.press("Tab")
                          assert page.evaluate("document.activeElement?.classList.contains('skip-nav')"),"Skip link not first tab stop"
                          assert page.locator(".skip-nav").bounding_box()["y"]>=0,"Skip link not visible"
                          page.locator(".skip-nav").press("Enter")
                          assert page.evaluate("location.hash")=="#top", "Skip link destination wrong"
                          assert page.evaluate("document.activeElement?.id")=="top","Main not focused after skip link"
                          first=page.locator("details.faq-item").first
                          assert first.get_attribute("open") is None
                          first.locator("summary").click()
                          assert first.get_attribute("open") is not None, "FAQ opening failed"
                          first.locator("summary").click()
                          assert first.get_attribute("open") is None,"FAQ closing failed"
                          second=page.locator("details.faq-item").nth(1)
                          second.locator("summary").focus()
                          second.locator("summary").press("Enter")
                          assert second.get_attribute("open") is not None,"Keyboard FAQ opening failed"
                          second.locator("summary").press("Space")
                          assert second.get_attribute("open") is None,"Keyboard FAQ closing failed"
                          for index in (13,23,31):
                              page.locator("details.faq-item").nth(index).locator("summary").click()
                          assert page.evaluate("Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)<=window.innerWidth+1"),"Horizontal overflow with expanded FAQ"
                          if theme=="dark":
                              page.locator(".faq-index-links a").first.hover()
                              assert page.locator(".faq-index-links a").first.evaluate("(e)=>getComputedStyle(e).color")=="rgb(255, 113, 132)","Dark hover contrast"
                          else:
                              assert page.locator(".faq-status").first.evaluate("(e)=>getComputedStyle(e).color")=="rgb(82, 102, 124)","Light status contrast"
                          page.locator(".site-theme-toggle").click()
                          opposite="light" if theme=="dark" else "dark"
                          assert page.locator("html").get_attribute("data-theme")==opposite, "Toggle did not switch"
                          page.locator(".site-theme-toggle").click()
                          assert page.locator("html").get_attribute("data-theme")==theme,"Toggle did not restore"
                          assert not errors, f"Errors: {errors}"
                          page.screenshot(path=str(OUT/f"faq-{width}-{theme}.png"),full_page=True)
                          results.append({"width":width,"theme":theme,"result":"PASS","expanded":3,"pageerrors":len(errors)})
                          print(f"PASS Chromium FAQ 36 {width}px {theme}",flush=True)
                          context.close()
                  browser.close()
          finally:
              server.shutdown()
              (OUT/"results.json").write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faq-36-chromium
          path: qa-artifacts/faq-36/
