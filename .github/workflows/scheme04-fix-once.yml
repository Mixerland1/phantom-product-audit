name: Scheme 04 LAN port label correction
on:
  push:
    branches: [fix/scheme04-lan-ports-20261116]
    paths: ['.github/workflows/scheme04-fix-once.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image processing dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
      - name: Replace only six port labels, retaining every other pixel
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image, ImageDraw, ImageFont, ImageChops

          source=Path('assets/schemes/protocols-sip-h323.webp')
          original_bytes=source.read_bytes()
          expected_sha='cfbba6fba0889af76ca2c45d5cdff108edbcf8f167401e5bc26495f4fd1dcc56'
          assert sha256(original_bytes).hexdigest()==expected_sha, 'Original scheme changed, do not patch blindly'
          before=Image.open(source).convert('RGB')
          assert before.size==(1448,1086), f'Unexpected scheme dimensions: {before.size}'
          after=before.copy()
          px=after.load()
          centers=[319,360,402,709,751,793]
          for cy in centers:
              for y in range(cy-14,cy+15):
                  left=px[483,y]
                  right=px[523,y]
                  for x in range(487,518):
                      t=(x-483)/40
                      px[x,y]=tuple(round(left[k]*(1-t)+right[k]*t) for k in range(3))
          d=ImageDraw.Draw(after)
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf',19)
          for cy,label in zip(centers,['Lan1','Lan2','Lan3']*2):
              bbox=d.textbbox((0,0),label,font=font)
              tw=bbox[2]-bbox[0]
              th=bbox[3]-bbox[1]
              x=round(502-tw/2-bbox[0])
              y=round(cy-th/2-bbox[1])
              d.text((x,y),label,font=font,fill=(1,8,20))
          after.save(source,lossless=True,method=6)
          reread=Image.open(source).convert('RGB')
          assert reread.size==before.size
          difference=ImageChops.difference(before,reread)
          bounds=difference.getbbox()
          assert bounds, 'No edit was applied'
          assert 475<=bounds[0]<=529 and 475<=bounds[2]<=530, f'Unexpected horizontal changes: {bounds}'
          assert 298<=bounds[1] and bounds[3]<=815, f'Unexpected vertical changes: {bounds}'
          changed=0
          for y in range(before.height):
              for x in range(before.width):
                  if difference.getpixel((x,y)) !=(0,0,0):
                      changed+=1
                      assert 475<=x<=529 and (298<=y<=420 or 690<=y<=814), (
                          f'Unrelated pixel was modified at {(x,y)}'
                      )
          assert changed>3000, 'Unexpectedly few corrected pixels'
          print('SCHEME_04_PASS six LAN port labels; 1448x1086; '
                f'{changed} changed pixels only in two port stacks; '
                f'original SHA256 {expected_sha}; new SHA256 {sha256(source.read_bytes()).hexdigest()}',flush=True)
          out=Path('qa-artifacts/scheme04')
          out.mkdir(parents=True,exist_ok=True)
          after.crop((435,275,550,430)).resize((460,620)).save(out/'ports-main.png')
          after.crop((435,665,550,821)).resize((460,624)).save(out/'ports-reserve.png')
          PY
      - name: Commit corrected full-size scheme to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/schemes/protocols-sip-h323.webp
          git commit -m "Correct E1 to Lan1/Lan2/Lan3 in both Phantom recording systems"
          git fetch origin fix/scheme04-lan-ports-20261116
          git rebase origin/fix/scheme04-lan-ports-20261116
          git push origin HEAD:fix/scheme04-lan-ports-20261116
      - uses: actions/upload-artifact@v4
        with:
          name: scheme04-lan-correction-proof
          path: qa-artifacts/scheme04/*.png
