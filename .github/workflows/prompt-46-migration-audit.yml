name: Prompt 46 — complete local migration audit
on:
  push:
    branches:
      - integrator/prompt-46-final-migration-20261115
    paths:
      - tools/final_migration_audit.py
      - .github/workflows/prompt-46-migration-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run link, inventory and source-byte checks for all root pages
        id: audit
        continue-on-error: true
        run: python tools/final_migration_audit.py
      - name: Commit machine-readable evidence to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHANTOM_FINAL_MIGRATION_46.json
          if ! git diff --cached --quiet; then
            git commit -m "Record complete prompt 46 page/link/asset audit"
            git fetch origin integrator/prompt-46-final-migration-20261115
            git rebase origin/integrator/prompt-46-final-migration-20261115
            git push origin HEAD:integrator/prompt-46-final-migration-20261115
          fi
      - name: Fail if mandatory migration checks have errors
        if: steps.audit.outcome == 'failure'
        run: exit 1
