name: Phantom browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'tools/browser_qa.py'
      - 'tools/final_migration_audit.py'
      - 'tools/build_requisites_pdfs.py'
      - '.github/workflows/phantom-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify original JPG-based requisites PDF copies
        run: python tools/build_requisites_pdfs.py --check
      - name: Final migration audit (55 canonical pages, links, original assets)
        run: python tools/final_migration_audit.py
      - name: Original file checks and Chromium on all canonical pages at 4 widths and 2 themes
        run: python tools/browser_qa.py
      - name: Upload QA report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-browser-qa
          path: |
            qa-artifacts/
            docs/PHANTOM_FINAL_MIGRATION_46.json
          if-no-files-found: warn
