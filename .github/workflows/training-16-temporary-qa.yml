name: Training prompt 16 isolated Chromium QA
on:
  pull_request:
    branches: [main]
    paths: ['training.html', '.github/workflows/training-16-temporary-qa.yml']
permissions:
  contents: read
jobs:
  chromium-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser QA of training page
        run: |
          python - <<'PY'
          import json, threading
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(("127.0.0.1",0),partial(Quiet,directory=str(Path.cwd())))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          url=f"http://127.0.0.1:{server.server_port}/training.html"
          Path("qa-training-artifacts").mkdir(exist_ok=True)
          passes,failures=[],[]
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=["--no-sandbox"])
                  for width,height in [(375,812),(768,900),(1024,768),(1440,900)]:
                      for theme in ("light","dark"):
                          context=browser.new_context(viewport={"width":width,"height":height},reduced_motion="reduce")
                          context.add_init_script(f"localStorage.setItem('mdis-theme','{theme}')")
                          page=context.new_page()
                          errs=[]
                          page.on("pageerror",lambda e:errs.append(str(e)))
                          case=f"training.html {width}px {theme}"
                          try:
                              response=page.goto(url,wait_until="load",timeout=30000)
                              assert response and response.status==200, "page HTTP failure"
                              assert page.locator("h1").count()==1 and page.locator("h1").inner_text()=="Обучение по Phantom","H1"
                              assert page.locator('meta[name="robots"]').get_attribute("content")=="noindex, nofollow","robots"
                              assert page.locator("html").get_attribute("data-theme")==theme,"Theme not applied"
                              assert page.locator(".site-header").count()==1,"Shared header absent"
                              assert page.locator("#site-footer").count()==1,"Shared footer absent"
                              assert page.locator(".demo").count()==0,"Old approval label"
                              assert page.locator('.solutions-switcher[aria-label="Переход между услугами"]').count()==1,"Service switcher missing"
                              assert page.locator('.solutions-switcher-label[href="services.html"]').count()==1,"Service switcher hub wrong"
                              assert page.locator('.solutions-switcher-neighbor--previous[href="modernization.html"]').count()==1,"Previous service wrong"
                              assert page.locator('.solutions-switcher-neighbor--next[href="services.html"]').count()==1,"Next service wrong"
                              assert page.locator('.training-links a[href="connection-schemes.html"]').count()==1,"Local connection schemes link missing"
                              assert page.locator('.training-links a[href="faq.html#versions"]').count()==1,"FAQ route wrong"
                              assert page.locator('a[href="personal-solutions.html"]').count()>=1,"Personal services link missing"
                              assert page.locator('a[href="modernization.html"]').count()>=1,"Modernization link missing"
                              assert not page.locator('main a[target="_blank"]').count(),"Internal links open in new tabs"
                              assert page.locator('.training-case').count()==2,"Actual case cards not preserved"
                              assert page.locator('.training-card').count()>=12,"Training content cards missing"
                              mail=page.locator('.training-request-action a[href^="mailto:sales@mdis.ru?"]')
                              assert mail.count()==1,"Email CTA missing"
                              parts=mail.evaluate("""e=>{let u=new URL(e.href);return {to:u.pathname,subject:u.searchParams.get('subject'),body:u.searchParams.get('body')}}""")
                              assert parts["to"]=="sales@mdis.ru","Wrong email recipient"
                              assert "обучение" in parts["subject"],"Wrong email subject"
                              for label in ("Версия Phantom:","Операционная система:","Количество слушателей:","Роли:","Формат обучения:","Что нужно освоить:"):
                                  assert label in parts["body"],"Mailto incomplete: "+label
                              metrics=page.evaluate("""()=>{let h=document.querySelector('main>.hero'),i=h?.querySelector('.hero-in'),a=h?.getBoundingClientRect(),b=i?.getBoundingClientRect();return {vp:document.documentElement.clientWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,hero:a?{y:a.y,height:a.height}:null,inner:b?{y:b.y,height:b.height}:null}}""")
                              assert metrics["doc"]<=metrics["vp"]+2 and metrics["body"]<=metrics["vp"]+2, "Horizontal overflow "+str(metrics)
                              if width>=1200:
                                  a,b=metrics["hero"],metrics["inner"]
                                  assert b["y"]>=a["y"]-3 and b["y"]+b["height"]<=a["y"]+a["height"]+3, "Hero clipping "+str(metrics)
                              broken=page.evaluate("""() => [...document.images].filter(i=>i.complete&&i.naturalWidth===0&&new URL(i.src).origin===location.origin).map(i=>i.src)""")
                              assert not broken,"Broken images: "+str(broken)
                              link=page.locator('.training-links a[href="connection-schemes.html"]')
                              link.focus()
                              assert link.evaluate("e=>getComputedStyle(e).outlineStyle")!="none","Focus ring absent"
                              toggle=page.locator(".site-theme-toggle")
                              toggle.click()
                              opposite="dark" if theme=="light" else "light"
                              assert page.locator("html").get_attribute("data-theme")==opposite,"Theme toggle failed"
                              assert page.evaluate("localStorage.getItem('mdis-theme')")==opposite,"Theme not persisted"
                              toggle.click()
                              assert page.locator("html").get_attribute("data-theme")==theme,"Theme restoration failed"
                              if width<=1080:
                                  nav=page.locator(".site-mobile-menu")
                                  nav.locator(":scope > summary").click()
                                  assert nav.get_attribute("open") is not None,"Mobile menu failed"
                                  nav.locator(":scope > summary").click()
                              assert not errs,"JS errors "+str(errs)
                              page.evaluate("window.scrollTo(0,0)")
                              page.screenshot(path=f"qa-training-artifacts/training-{width}-{theme}.png",full_page=True)
                              print("PASS",case,"hero",metrics["hero"],"inner",metrics["inner"],flush=True)
                              passes.append(case)
                          except Exception as e:
                              failures.append(f"{case}: {e}")
                              print("FAIL",case,str(e),flush=True)
                              try:page.screenshot(path=f"qa-training-artifacts/FAIL-training-{width}-{theme}.png",full_page=True)
                              except Exception:pass
                          context.close()
                  browser.close()
          finally:
              server.shutdown()
          print(json.dumps({"passed":len(passes),"failed":len(failures),"errors":failures},ensure_ascii=False),flush=True)
          if failures: raise SystemExit(1)
          PY
      - name: Upload all screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-16-browser-qa
          path: qa-training-artifacts/
          if-no-files-found: warn
