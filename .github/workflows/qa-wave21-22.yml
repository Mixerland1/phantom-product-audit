name: Phantom wave 21-22 browser QA (temporary)
on:
  push:
    branches: [integrator/wave-21-22]
    paths: [.github/workflows/qa-wave21-22.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser QA at four widths, both themes
        shell: bash
        run: |
          python -m http.server 8799 --bind 127.0.0.1 >/tmp/phantom-qa-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          BASE='http://127.0.0.1:8799/'
          pages=['phantom-monitoring.html','phantom-asr.html','phantom-cross.html','connection-schemes.html','telephone-recording.html','dispatcher-recording.html','phantom-catalog.html','phantom-home.html','modernization.html']
          failures=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(viewport={'width':1440,'height':900}, device_scale_factor=1)
              page=context.new_page()
              page_errors=[]
              page.on('pageerror',lambda exc: page_errors.append(str(exc)))
              for file in pages:
                  response=page.goto(BASE+file,wait_until='load',timeout=20000)
                  if not response or response.status!=200: failures.append((file,'HTTP',response.status if response else 'none')); continue
                  page.wait_for_timeout(100)
                  h1=page.locator('h1').count()
                  if h1!=1:failures.append((file,'H1',h1))
                  if file in ('phantom-monitoring.html','phantom-asr.html','phantom-cross.html','connection-schemes.html','telephone-recording.html','dispatcher-recording.html'):
                      nav=page.locator('nav.solutions-switcher')
                      if nav.count()!=1: failures.append((file,'NAV',nav.count()))
                      else:
                          if nav.locator('a.solutions-switcher-label').count()!=1:failures.append((file,'ALL_LINK'))
                          if file in ('phantom-monitoring.html','phantom-asr.html'):
                              if page.locator('.site-menu--current').count()!=1:failures.append((file,'PRODUCT_MENU_HIGHLIGHT'))
                  for theme in ['light','dark']:
                      page.evaluate('(theme)=>document.documentElement.setAttribute("data-theme",theme)',theme)
                      for width in [375,768,1024,1440]:
                          page.set_viewport_size({'width':width,'height':900})
                          page.wait_for_timeout(70)
                          data=page.evaluate('''() => ({
                            scroll:document.documentElement.scrollWidth,
                            inner:window.innerWidth,
                            nav:document.querySelector('.solutions-switcher') !== null,
                            prevVisible: (()=>{const x=document.querySelector('.solutions-switcher-neighbor--previous'); return x ? getComputedStyle(x).display!=='none' : null})(),
                            nextVisible: (()=>{const x=document.querySelector('.solutions-switcher-neighbor--next'); return x ? getComputedStyle(x).display!=='none' : null})(),
                            broken:[...document.images].filter(i=>i.src.startsWith(location.origin) && i.complete && i.naturalWidth===0).map(i=>i.getAttribute('src')).slice(0,6)
                          })''')
                          if data['scroll']>data['inner']+2:failures.append((file,theme,width,'OVERFLOW',data['scroll']-data['inner']))
                          if file in ('phantom-monitoring.html','phantom-asr.html','connection-schemes.html') and (data['prevVisible'] is not True or data['nextVisible'] is not True):failures.append((file,theme,width,'NAV_LABEL_HIDDEN'))
                          if data['broken']:failures.append((file,theme,width,'BROKEN_IMG',data['broken']))
                      print('QA_PAGE',json.dumps({'file':file,'theme':theme,'widths':[375,768,1024,1440]},ensure_ascii=False))
              browser.close()
              if page_errors:failures.append(('JAVASCRIPT_ERRORS',page_errors[:12]))
          print('QA_FAILURES',json.dumps(failures,ensure_ascii=False))
          if failures:raise SystemExit(1)
          print('QA_SUCCESS: nine pages, four widths, both themes, no overflow or broken local images')
          PY
