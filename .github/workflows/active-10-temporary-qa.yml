name: Phantom Active isolated Chromium QA
on:
  pull_request:
    branches: [main]
    paths: ['phantom-active.html', '.github/workflows/active-10-temporary-qa.yml']
permissions:
  contents: read
jobs:
  chromium-active:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser QA Phantom Active all widths/themes
        run: |
          python - <<'PY'
          import json,threading
          from functools import partial
          from pathlib import Path
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          
          server=ThreadingHTTPServer(("127.0.0.1",0),partial(Quiet,directory=str(Path.cwd())))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          url=f"http://127.0.0.1:{server.server_port}/phantom-active.html"
          Path("qa-active-artifacts").mkdir(exist_ok=True)
          passed,failed=[],[]
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=["--no-sandbox"])
                  for width,height in [(375,812),(768,900),(1024,768),(1440,900)]:
                      for theme in ["light","dark"]:
                          context=browser.new_context(viewport={"width":width,"height":height},reduced_motion="reduce")
                          context.add_init_script(f"localStorage.setItem('mdis-theme','{theme}')")
                          page=context.new_page()
                          errs=[]
                          page.on("pageerror",lambda e: errs.append(str(e)))
                          ident=f"{width}px {theme}"
                          try:
                              resp=page.goto(url,wait_until="load",timeout=30000)
                              assert resp and resp.status==200, "HTTP not 200"
                              assert page.locator("h1").count()==1, "H1 invalid"
                              assert page.locator('meta[name="robots"]').get_attribute("content")=="noindex, nofollow"
                              assert page.locator("html").get_attribute("data-theme")==theme, "Theme bootstrap failed"
                              assert page.locator(".site-header").count()==1, "Shared header missing"
                              assert page.locator("#site-footer").count()==1, "Shared footer missing"
                              assert page.locator(".product-switcher").count()==1, "Product switcher missing"
                              assert page.locator('.product-parent-link[href="phantom-catalog.html"]').count()==1, "Parent route wrong"
                              assert page.locator('.product-next-link[href="phantom-home.html#industries"]').count()==1, "Next section route wrong"
                              controls=page.locator(".product-carousel-control")
                              assert controls.count()==2, "Missing product controls"
                              labels=[x.get_attribute("aria-label") for x in controls.all()]
                              assert any("Ультра" in x for x in labels), f"Wrong previous product: {labels}"
                              assert any("Платы Phantom" in x for x in labels), f"Wrong next product: {labels}"
                              assert page.locator('.text-link[href="training.html"]').count()==1,"Old external training link remains"
                              assert all(page.locator(f'.resource[href="support-phantom-active.html#{anchor}"]').count()==1 for anchor in ("manuals","integrations","brochures")),"Document deep-links missing"
                              assert page.locator('.text-link[href="ip-telephony.html"]').count()==1,"IP recording link missing"
                              assert page.locator('.active-spec[role="table"] [role="row"]').count()==6, "Specs table invalid"
                              assert page.locator('.product-form[data-subject="Запрос по Phantom Active"]').count()==1,"Form subject invalid"
                              metrics=page.evaluate("""() => ({
                                 viewport:document.documentElement.clientWidth,
                                 html:document.documentElement.scrollWidth,
                                 body:document.body.scrollWidth,
                                 hero:(()=>{let h=document.querySelector('main>.hero');let inner=h?.querySelector('.hero-in');let a=h?.getBoundingClientRect(),b=inner?.getBoundingClientRect();return {box:a?{y:a.y,height:a.height}:null,inner:b?{y:b.y,height:b.height}:null}})()
                              })""")
                              assert metrics["html"]<=metrics["viewport"]+2 and metrics["body"]<=metrics["viewport"]+2,f"Overflow {metrics}"
                              hb,inner=metrics["hero"]["box"],metrics["hero"]["inner"]
                              if width>=901:
                                  assert inner["y"]>=hb["y"]-4 and inner["y"]+inner["height"]<=hb["y"]+hb["height"]+4,f"Hero clipped {metrics}"
                              broken=page.evaluate("""() => [...document.images].filter(i=>i.complete && i.naturalWidth===0 && new URL(i.src).origin===location.origin).map(i=>i.getAttribute('src'))""")
                              assert not broken,f"Broken images {broken}"
                              resource=page.locator(".resource").first
                              resource.focus()
                              assert resource.evaluate("(e) => getComputedStyle(e).outlineStyle")!="none","No keyboard focus"
                              toggler=page.locator(".site-theme-toggle")
                              toggler.click()
                              opposite="dark" if theme=="light" else "light"
                              assert page.locator("html").get_attribute("data-theme")==opposite,"Theme toggle failed"
                              assert page.evaluate("localStorage.getItem('mdis-theme')")==opposite,"Theme not persisted"
                              toggler.click()
                              assert page.locator("html").get_attribute("data-theme")==theme,"Theme restore failed"
                              if width<=1080:
                                  menu=page.locator(".site-mobile-menu")
                                  menu.locator(":scope > summary").click()
                                  assert menu.get_attribute("open") is not None,"Mobile menu open failed"
                                  menu.locator(":scope > summary").click()
                              assert not errs,f"Page errors {errs}"
                              page.evaluate("window.scrollTo(0,0)")
                              page.screenshot(path=f"qa-active-artifacts/active-{width}-{theme}.png",full_page=True)
                              passed.append(ident)
                              print("PASS",ident,"hero",metrics["hero"],flush=True)
                          except Exception as e:
                              failed.append(f"{ident}: {e}")
                              print("FAIL",ident,str(e),flush=True)
                              try: page.screenshot(path=f"qa-active-artifacts/FAIL-active-{width}-{theme}.png",full_page=True)
                              except Exception: pass
                          context.close()
                  browser.close()
          finally:
              server.shutdown()
          print(json.dumps({"passed":len(passed),"failed":len(failed),"errors":failed},ensure_ascii=False),flush=True)
          if failed:raise SystemExit(1)
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-10-browser-qa
          path: qa-active-artifacts/
          if-no-files-found: warn
