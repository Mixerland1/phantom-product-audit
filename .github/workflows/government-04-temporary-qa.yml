name: Government page temporary QA
on:
  pull_request:
    branches: [main]
    paths: ['government.html', '.github/workflows/government-04-temporary-qa.yml']
permissions:
  contents: read
jobs:
  government-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real Chromium QA, eight government layouts
        run: |
          python - <<'PY'
          import json, threading
          from functools import partial
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args): pass
          
          root=Path.cwd()
          server=ThreadingHTTPServer(("127.0.0.1",0),partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          url=f"http://127.0.0.1:{server.server_port}/government.html"
          results=[]
          errors=[]
          Path("qa-artifacts").mkdir(exist_ok=True)
          def check(cond,msg):
              if not cond: raise AssertionError(msg)
          
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=["--no-sandbox"])
                  for width,height in [(375,812),(768,900),(1024,768),(1440,900)]:
                      for theme in ("light","dark"):
                          context=browser.new_context(viewport={"width":width,"height":height},device_scale_factor=1,reduced_motion="reduce")
                          context.add_init_script(f"localStorage.setItem('mdis-theme','{theme}')")
                          page=context.new_page()
                          page_errors=[]
                          page.on("pageerror",lambda error:page_errors.append(str(error)))
                          ident=f"government.html {width}px {theme}"
                          try:
                              response=page.goto(url,wait_until="load",timeout=30000)
                              check(response and response.status==200,"HTTP failure")
                              check(page.locator("h1").count()==1,"H1 count")
          check(page.locator("html").get_attribute("data-theme")==theme,"theme preference was not applied")
                              check(page.locator("h1").inner_text().strip()=="Госструктуры","wrong H1")
                              check(page.locator('meta[name="robots"]').get_attribute("content")=="noindex, nofollow","robots")
                              check(page.locator(".site-header").count()==1,"shared header not mounted")
                              check(page.locator("#site-footer").count()==1,"shared footer not mounted")
                              check(page.locator('.solutions-switcher-label[href="solutions.html"]').count()==1,"solutions switcher missing")
                              check(page.locator('.solutions-switcher-neighbor--previous[href="auto-dealers.html"]').count()==1,"previous neighbor wrong")
                              check(page.locator('.solutions-switcher-neighbor--next[href="financial.html"]').count()==1,"next neighbor wrong")
                              check(page.locator('.hero-visual[role="group"][aria-label]').count()==1,"diagram a11y")
                              check(page.locator(".demo").count()==0,"preview banner remains")
                              check(page.locator('.link-card[href="ip-telephony.html"]').count()==1,"broken related local route")
                              check(page.locator('.source-link[href="solutions.html#industries"]').count()==1,"broken solution hub route")
                              check(page.locator('a[href^="mailto:sales@mdis.ru?"]').count()==1,"missing mailto")
                              check(not page_errors,"JS pageerrors: "+str(page_errors))
                              metrics=page.evaluate("""() => ({vp:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth,body:document.body.scrollWidth})""")
                              check(metrics["scroll"]<=metrics["vp"]+2 and metrics["body"]<=metrics["vp"]+2,"horizontal overflow: "+str(metrics))
                              broken=page.evaluate("""() => [...document.images].filter(i=>i.complete && i.naturalWidth===0 && new URL(i.src).origin===location.origin).map(i=>i.getAttribute('src'))""")
                              check(not broken,"missing images: "+str(broken))
                              if width>=1024:
                                  bb=page.locator("main > .hero").bounding_box()
                                  inside=page.locator(".hero .hero-in").bounding_box()
                                  check(bb is not None and inside is not None,"hero boxes missing")
                                  check(inside["y"]>=bb["y"]-3 and inside["y"]+inside["height"]<=bb["y"]+bb["height"]+3,"hero inner block clipped by 632px stage")
                              page.locator(".link-card").first.focus()
                              focus=page.locator(".link-card").first.evaluate("(e) => getComputedStyle(e).outlineStyle")
                              check(focus!="none","keyboard focus absent")
                              if width<=1080:
                                  mobile=page.locator(".site-mobile-menu")
                                  mobile.locator(":scope > summary").click()
                                  check(mobile.get_attribute("open") is not None,"mobile menu failed")
                                  mobile.locator(":scope > summary").click()
                              page.evaluate("window.scrollTo(0,0)")
                    page.screenshot(path=f"qa-artifacts/government-{width}-{theme}.png",full_page=True)
                              results.append(ident)
                              print("PASS",ident,flush=True)
                          except Exception as e:
                              errors.append(f"{ident}: {e}")
                              print("FAIL",ident,str(e),flush=True)
                              page.screenshot(path=f"qa-artifacts/government-FAIL-{width}-{theme}.png",full_page=True)
                          finally:
                              context.close()
                  browser.close()
          finally:
              server.shutdown()
          print(json.dumps({"passed":len(results),"failed":len(errors),"errors":errors},ensure_ascii=False),flush=True)
          if errors: raise SystemExit(1)
          PY
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: government-04-qa
          path: qa-artifacts/
          if-no-files-found: warn
