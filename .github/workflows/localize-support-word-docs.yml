name: Localize original Word documents on support pages

on:
  push:
    branches:
      - integration/localize-support-word-docs-20261115
    paths:
      - tools/localize_support_word_docs.py
      - .github/workflows/localize-support-word-docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-word:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate original Word files
        run: python tools/localize_support_word_docs.py
      - name: Verify Word file hashes and local HTML links
        run: python tools/localize_support_word_docs.py --verify
      - name: Commit unchanged originals and localized links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/support/ support-phantom-2.html support-phantom-4.html support-phantom-active.html support-phantom-ultra.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Localize 17 original support Word documents"
            git fetch origin integration/localize-support-word-docs-20261115
            git rebase origin/integration/localize-support-word-docs-20261115
            git push origin HEAD:integration/localize-support-word-docs-20261115
          fi
